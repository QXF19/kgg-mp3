name: Windows portable EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install FFmpeg locally
        shell: powershell
        run: ./install-ffmpeg.ps1

      - name: Install SQLite locally
        shell: powershell
        run: ./install-sqlite.ps1

      - name: Install desktop UI dependencies
        shell: powershell
        run: ./install-ui.ps1

      - name: Build portable EXE package
        shell: powershell
        run: ./package-windows.ps1 -Version '${{ github.ref_type == 'tag' && github.ref_name || '1.1.2' }}'.TrimStart('v')

      - name: Verify audio conversion
        shell: pwsh
        run: |
          java --version
          javac -encoding UTF-8 -cp build/classes -d build/test-classes src/test/java/cn/gkkstudio/MediaEngineSmokeTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Test compilation failed' }
          java -cp 'build/classes;build/test-classes' cn.gkkstudio.MediaEngineSmokeTest
          if ($LASTEXITCODE -ne 0) { throw 'Conversion test failed' }
          javac -encoding UTF-8 -cp build/classes -d build/test-classes src/test/java/cn/gkkstudio/KggV5CompatibilityTest.java
          if ($LASTEXITCODE -ne 0) { throw 'V5 test compilation failed' }
          java -cp 'build/classes;build/test-classes' cn.gkkstudio.KggV5CompatibilityTest
          if ($LASTEXITCODE -ne 0) { throw 'KGG v5 compatibility test failed' }

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: kgg-mp3-windows-x64
          path: dist/kgg-mp3-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = '${{ github.ref_name }}'
          $env:GH_REPO = '${{ github.repository }}'
          $ReleasesJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list GitHub releases' }
          $Releases = $ReleasesJson | ConvertFrom-Json
          $ReleaseExists = @($Releases | Where-Object { $_.tagName -eq $Tag }).Count -gt 0
          if ($ReleaseExists) {
            gh release upload $Tag 'dist/kgg-mp3-windows-x64.zip' --clobber
          } else {
            gh release create $Tag 'dist/kgg-mp3-windows-x64.zip' --title "kgg-mp3 $Tag" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
